
name: yolo_live_detection
description: "AI Navigation Assistant for visually impaired people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  http: ^1.6.0
  camera: ^0.12.2
  camera_android_camerax: ^0.7.6
  web_socket_channel: ^3.0.3
  image: ^4.12.0

  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  flutter_dotenv: ^6.0.1

  open_wake_word: ^0.3.0
  record: ^6.0.0

  tflite_flutter: ^0.12.1

dependency_overrides:
  camera_android_camerax:
    path: third_party/camera_android_camerax
  tflite_flutter:
    path: third_party/tflite_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

    # OpenWakeWord models
    - assets/models/melspectrogram.onnx
    - assets/models/embedding_model.onnx
    - assets/models/hey_jarvis_v0.1.onnx

    # Offline YOLO11n
    - assets/models/yolo11n_rod.tflite
